name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            os: ubuntu-latest
            cmake_args: -DCMAKE_CXX_COMPILER=g++
          - name: Clang
            os: ubuntu-latest
            cmake_args: -DCMAKE_CXX_COMPILER=clang++
          - name: AppleClang
            os: macos-latest
            cmake_args: ""
          - name: MSVC
            os: windows-latest
            cmake_args: ""
          - name: clang-cl
            os: windows-latest
            cmake_args: -T ClangCL

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure
        run: cmake -S . -B build ${{ matrix.cmake_args }} -DDECIMAL_BUILD_TESTS=ON -DDECIMAL_INSTALL=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="${{ runner.temp }}/decimal-install"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install
        run: cmake --install build --config Release

      - name: Configure installed-package consumer
        run: cmake -S test/install -B consumer-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ runner.temp }}/decimal-install"

      - name: Build installed-package consumer
        run: cmake --build consumer-build --config Release --parallel

      - name: Test installed-package consumer
        run: ctest --test-dir consumer-build -C Release --output-on-failure
